            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "description": "Canonical, non-nil UUID."
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful authoritative read.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/Result"
                    }
                  }
                }
              }
            }
          },
          "400": {

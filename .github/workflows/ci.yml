name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create isolated local test environment
        run: pnpm setup:local

      - name: Start PostgreSQL fixtures
        run: pnpm db:up

      - name: Deployment script syntax
        run: bash -n scripts/deploy-production.sh

      - name: Static checks
        run: pnpm check

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser and HTTP acceptance tests
        run: pnpm test:e2e

      - name: Database invariants
        run: pnpm check:invariants

      - name: OpenAPI lint
        run: pnpm contract:lint

      - name: Production build
        run: pnpm build

      - name: Secret scan
        run: pnpm check:secrets

      - name: Stop test databases
        if: always()
        run: pnpm db:down


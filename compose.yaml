name: assembly-erp

services:
  postgres-demo:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: erp_demo
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  postgres-test:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: erp_test
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local first}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

volumes:
  demo-data:
  test-data:
